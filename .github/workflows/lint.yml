name: Lint

on:
  push:
    branches:
      [ "main" ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Golang
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate gRPC/connect code
        run: buf dep update && buf generate

      - name: Lint protobuf
        run: buf lint

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version-file: .golangci-lint-version

      - name: Run golangci-lint (integration tests)
        uses: golangci/golangci-lint-action@v9
        with:
          version-file: .golangci-lint-version
          args: --build-tags integration ./test/integration/...

      - name: Architecture rules
        run: go run github.com/arch-go/arch-go/v2@v2.1.2
