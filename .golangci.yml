version: "2"

run:
  timeout: 5m


linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - bodyclose
    - noctx
    - exhaustive
    - nilerr
    - errorlint
    - wrapcheck
    - revive
    - gocritic
    - whitespace
    - usestdlibvars
    - unparam
    - gocognit
    - funlen
    - dupl

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - wrapcheck
          - funlen
          - gocognit
          - dupl
          - bodyclose

  settings:
    gocognit:
      min-complexity: 15

    funlen:
      lines: 100
      statements: 50

    dupl:
      threshold: 200

    wrapcheck:
      ignore-package-globs:
        - "github-release-notifier/*"
        - "database/sql"
        - "os"
        - "io"
        - "google.golang.org/grpc/status"

    revive:
      rules:
        - name: bool-literal-in-expr
        - name: context-as-argument
        - name: error-return
        - name: increment-decrement
        - name: redefines-builtin-id
        - name: var-naming

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance

    errorlint:
      errorf: true
      errorf-multi: true
      asserts: true
      comparison: true

formatters:
  enable:
    - gofmt
    - goimports
    - golines
  settings:
    goimports:
      local-prefixes:
        - github-release-notifier
    golines:
      max-len: 120

issues:
  max-same-issues: 0
  max-issues-per-linter: 0
