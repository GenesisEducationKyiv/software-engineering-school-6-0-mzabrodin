version: "2"

run:
  timeout: 5m


linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - bodyclose
    - noctx
    - exhaustive
    - nilerr
    - errorlint
    - wrapcheck
    - revive
    - gocritic
    - whitespace
    - usestdlibvars
    - unparam
    - gocognit
    - funlen
    - dupl
    - depguard

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - wrapcheck
          - funlen
          - gocognit
          - dupl
          - bodyclose

  settings:
    depguard:
      rules:
        shared-and-infrastructure:
          list-mode: lax
          files:
            - "**/internal/shared/**"
            - "**/internal/infrastructure/**"
          deny:
            - pkg: github-release-notifier/internal/subscription
              desc: shared/infrastructure must not import a bounded-context module
            - pkg: github-release-notifier/internal/scanner
              desc: shared/infrastructure must not import a bounded-context module
            - pkg: github-release-notifier/internal/notifier
              desc: shared/infrastructure must not import a bounded-context module
            - pkg: github-release-notifier/internal/saga
              desc: shared/infrastructure must not import a bounded-context module
        notifier:
          list-mode: lax
          files:
            - "**/internal/notifier/**"
          deny:
            - pkg: github-release-notifier/internal/subscription
              desc: notifier must not import another bounded-context module
            - pkg: github-release-notifier/internal/scanner
              desc: notifier must not import another bounded-context module
            - pkg: github-release-notifier/internal/saga
              desc: notifier must not import another bounded-context module
        subscription:
          list-mode: lax
          files:
            - "**/internal/subscription/**"
          deny:
            - pkg: github-release-notifier/internal/scanner
              desc: subscription must not import scanner (no such edge in the module DAG)
            - pkg: github-release-notifier/internal/notifier
              desc: subscription reaches the notifier only through its own consumer-defined port (wired in cmd)
            - pkg: github-release-notifier/internal/saga
              desc: subscription reacts to the saga only via the saga.compensate event (shared/events), never an import
        scanner:
          list-mode: lax
          files:
            - "**/internal/scanner/**"
          deny:
            - pkg: github-release-notifier/internal/subscription
              desc: scanner reaches subscription only through its own repository ports (wired in cmd)
            - pkg: github-release-notifier/internal/notifier
              desc: scanner reaches the notifier only through its own consumer-defined port (wired in cmd)
            - pkg: github-release-notifier/internal/saga
              desc: scanner must not import another bounded-context module
        saga:
          list-mode: lax
          files:
            - "**/internal/saga/**"
          deny:
            - pkg: github-release-notifier/internal/subscription
              desc: saga must not import another bounded-context module
            - pkg: github-release-notifier/internal/scanner
              desc: saga must not import another bounded-context module
            - pkg: github-release-notifier/internal/notifier
              desc: saga must not import another bounded-context module

    gocognit:
      min-complexity: 15

    funlen:
      lines: 100
      statements: 50

    dupl:
      threshold: 200

    wrapcheck:
      ignore-package-globs:
        - "github-release-notifier/*"
        - "database/sql"
        - "os"
        - "io"
        - "google.golang.org/grpc/status"

    revive:
      rules:
        - name: bool-literal-in-expr
        - name: context-as-argument
        - name: error-return
        - name: increment-decrement
        - name: redefines-builtin-id
        - name: var-naming

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      settings:
        hugeParam:
          sizeThreshold: 192

    errorlint:
      errorf: true
      errorf-multi: true
      asserts: true
      comparison: true

formatters:
  enable:
    - gofmt
    - goimports
    - golines
  settings:
    goimports:
      local-prefixes:
        - github-release-notifier
    golines:
      max-len: 120

issues:
  max-same-issues: 0
  max-issues-per-linter: 0
