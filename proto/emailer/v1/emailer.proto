syntax = "proto3";

package emailer.v1;

import "buf/validate/validate.proto";

option go_package = "github-release-notifier/internal/notifier/grpc/gen/emailerv1;emailerv1";

// EmailerService delivers transactional email over SMTP.
// It is an internal service-to-service API consumed only by the notifier app.
// Access is secured with mTLS.
service EmailerService {
  // SendConfirmation queues a subscription confirmation email.
  rpc SendConfirmation(SendConfirmationRequest) returns (SendConfirmationResponse);

  // SendReleaseNotifications delivers a batch of release emails and reports how many were sent and which recipients failed.
  rpc SendReleaseNotifications(SendReleaseNotificationsRequest) returns (SendReleaseNotificationsResponse);
}

message SendConfirmationRequest {
  string to = 1 [(buf.validate.field).string.email = true];
  // repo must be in "owner/repo" form (mirrors github.ParseRepo).
  string repo = 2 [(buf.validate.field).string.pattern = "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"];
  string confirm_url = 3 [(buf.validate.field).string.uri = true];
}

// Success is signalled by an OK status; the empty body leaves room to add fields later.
message SendConfirmationResponse {}

// ReleaseNotification mirrors entity.ReleaseNotification.
message ReleaseNotification {
  string to = 1 [(buf.validate.field).string.email = true];
  string repo = 2 [(buf.validate.field).string.min_len = 1];
  string tag = 3 [(buf.validate.field).string.min_len = 1];
  string release_url = 4 [(buf.validate.field).string.uri = true];
  string unsubscribe_url = 5 [(buf.validate.field).string.uri = true];
}

message SendReleaseNotificationsRequest {
  repeated ReleaseNotification notifications = 1 [(buf.validate.field).repeated.min_items = 1];
}

message SendReleaseNotificationsResponse {
  // sent is the number of notifications delivered successfully.
  uint32 sent = 1;
  // failed lists the recipient addresses whose delivery failed.
  repeated string failed = 2;
}
