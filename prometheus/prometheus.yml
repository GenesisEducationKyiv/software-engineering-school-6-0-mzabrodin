global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

scrape_configs:
  - job_name: github_release_notifier
    static_configs:
      - targets:
          - subscription:8080
    metrics_path: /metrics

  - job_name: github_release_notifier_emailer
    static_configs:
      - targets:
          - emailer:8081
    metrics_path: /metrics

  - job_name: github_release_notifier_scanner
    static_configs:
      - targets:
          - scanner:8082
    metrics_path: /metrics
