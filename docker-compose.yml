x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build: .
    container_name: github_release_notifier_app
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${DB_USER:?DB_USER required}:${DB_PASSWORD:?DB_PASSWORD required}@postgres:5432/${DB_NAME:?DB_NAME required}?sslmode=${DB_SSL_MODE:-disable}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379
    networks:
      - app_net
      - monitoring_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    container_name: github_release_notifier_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME required}
      POSTGRES_USER: ${DB_USER:?DB_USER required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: github_release_notifier_redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - app_net
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    container_name: github_release_notifier_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms512m -Xmx512m}
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - logging_net
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -v '\"status\":\"red\"'" ]
      interval: 10s
      timeout: 10s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 1g
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.2
    container_name: github_release_notifier_kibana
    ports:
      - "127.0.0.1:${KIBANA_PORT:-5601}:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - logging_net
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:5601/api/status | grep -v '\"level\":\"critical\"'" ]
      interval: 10s
      timeout: 10s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 1536m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:9.4.2
    container_name: github_release_notifier_filebeat
    user: root
    command: filebeat -e --strict.perms=false
    volumes:
      - filebeat_data:/usr/share/filebeat/data
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./filebeat/ilm-policy.json:/usr/share/filebeat/ilm-policy.json:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - logging_net
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "filebeat test output" ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256m
    logging: *default-logging
    restart: unless-stopped

  kibana-setup:
    image: curlimages/curl:8.20.0
    container_name: github_release_notifier_kibana_setup
    volumes:
      - ./kibana/dashboards.ndjson:/kibana/dashboards.ndjson:ro
    networks:
      - logging_net
    depends_on:
      kibana:
        condition: service_healthy
    restart: "no"
    logging: *default-logging
    command:
      - -sf
      - -X
      - POST
      - "http://kibana:5601/api/saved_objects/_import?overwrite=true"
      - -H
      - "kbn-xsrf: true"
      - -F
      - "file=@/kibana/dashboards.ndjson"

  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: github_release_notifier_prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring_net
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.0.1
    container_name: github_release_notifier_grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD required}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring_net
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 512m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: unless-stopped

networks:
  app_net:
    driver: bridge
  monitoring_net:
    driver: bridge
  logging_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
  filebeat_data:
  prometheus_data:
  grafana_data:
