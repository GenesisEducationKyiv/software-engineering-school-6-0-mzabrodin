version: 3

tasks:
  build:
    desc: Build all packages
    cmds:
      - go build ./...

  test-unit:
    desc: Run unit tests
    cmds:
      - go test -count=1 ./...

  test-integration:
    desc: Run integration tests (testcontainers & bufconn, requires Docker)
    deps:
      - _docker-check
    cmds:
      - go test -count=1 -tags integration ./test/integration/...

  test-all:
    desc: Run all tests (unit & integration)
    cmds:
      - task test-unit
      - task test-integration

  lint-core:
    desc: Run golangci-lint on the core packages (cmd & internal); pass --fix with `task lint-core -- --fix`
    cmds:
      - golangci-lint run {{.CLI_ARGS}}

  lint-integration:
    desc: Lint the integration tests; pass --fix with `task lint-integration -- --fix`
    cmds:
      - golangci-lint run --build-tags integration ./test/integration/... {{.CLI_ARGS}}

  lint-benchmark:
    desc: Lint the benchmarks; pass --fix with `task lint-benchmark -- --fix`
    cmds:
      - golangci-lint run --build-tags benchmark ./test/benchmark/... {{.CLI_ARGS}}

  lint-all:
    desc: Run all linters; pass --fix with `task lint-all -- --fix`
    cmds:
      - task lint-core -- {{.CLI_ARGS}}
      - task lint-integration -- {{.CLI_ARGS}}
      - task lint-benchmark -- {{.CLI_ARGS}}

  fmt:
    desc: Format the codebase
    cmds:
      - golangci-lint fmt

  proto:
    desc: Regenerate gRPC/connect stubs from proto/
    cmds:
      - buf dep update
      - buf generate

  proto-lint:
    desc: Lint the proto contracts with buf
    cmds:
      - buf lint

  bench:
    desc: Run the gRPC-vs-NATS compensation throughput benchmarks, 5 runs x 5s (testcontainers, requires Docker)
    deps:
      - _docker-check
    cmds:
      - go test -tags benchmark -run '^$' -bench 'Compensate' -benchmem -benchtime=5s -count=5 ./test/benchmark/...

  up:
    desc: Start the full stack with Docker Compose
    deps:
      - _docker-check
    cmds:
      - docker compose up -d

  up-build:
    desc: Rebuild images and start the stack
    deps:
      - _docker-check
    cmds:
      - docker compose up -d --build

  down:
    desc: Stop the stack
    deps:
      - _docker-check
    cmds:
      - docker compose down

  _docker-check:
    internal: true
    preconditions:
      - sh: docker info >/dev/null 2>&1
        msg: "Docker is not running. Start the Docker daemon and retry."
